<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine? 💖</title>
  <style>
    :root{ --bg1:#ffe6f0; --bg2:#fff7fb; --pink:#ff4d88; --pink2:#ff7ab2; --text:#2b2b2b; }
    *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial}
    body{ margin:0; min-height:100vh; display:grid; place-items:center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      overflow:hidden; color:var(--text);
    }
    .card{ width:min(520px,92vw); background:rgba(255,255,255,.75);
      border:1px solid rgba(255,255,255,.6); border-radius:24px;
      padding:28px 22px; text-align:center;
      box-shadow:0 16px 60px rgba(255,77,136,.18);
      backdrop-filter: blur(8px); position:relative;
    }
    h1{margin:0 0 10px;font-size:clamp(28px,4vw,38px)}
    p{margin:0 0 18px;opacity:.85}
    .heart{ font-size:52px; line-height:1; margin-bottom:10px;
      filter: drop-shadow(0 10px 18px rgba(255,77,136,.25));
      animation: float 2.8s ease-in-out infinite;
    }
    @keyframes float{50%{transform:translateY(-8px)}}
    .btns{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:8px;}
    button{ border:0; cursor:pointer; padding:12px 18px; border-radius:999px; font-size:16px;
      transition:transform .15s ease, box-shadow .15s ease; min-width:140px;
    }
    #yes{ background:linear-gradient(135deg,var(--pink),var(--pink2)); color:white;
      box-shadow:0 12px 22px rgba(255,77,136,.28);
    }
    #yes:hover{transform:translateY(-2px) scale(1.02)}
    #no{ background:white; color:var(--text); border:1px solid rgba(0,0,0,.08); position:relative;}
    .msg{ display:none; margin-top:16px; padding:12px 14px; border-radius:16px;
      background:white; border:1px solid rgba(255,77,136,.22);
    }
    .sparkle{ position:absolute; inset:-40px; pointer-events:none; opacity:.6;
      background:
        radial-gradient(circle, rgba(255,77,136,.22) 0 2px, transparent 3px) 0 0/42px 42px,
        radial-gradient(circle, rgba(255,122,178,.18) 0 2px, transparent 3px) 22px 22px/42px 42px;
      mask: radial-gradient(circle at center, #000 55%, transparent 80%);
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="sparkle"></div>
    <div class="heart">💖</div>
    <h1>Will you be my Valentine?</h1>
    <p>Just one click away from making me the happiest 😄</p>

    <div class="btns">
      <button id="yes">Yes 💘</button>
      <button id="no">No 🙈</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const msg = document.getElementById("msg");
    const card = document.getElementById("card");

    function moveNo() {
      const padding = 12;
      const rect = card.getBoundingClientRect();
      const x = Math.random() * (rect.width - noBtn.offsetWidth - padding*2) + padding;
      const y = Math.random() * (rect.height - noBtn.offsetHeight - padding*2) + padding;
      noBtn.style.position = "absolute";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveNo(); }, {passive:false});

    yesBtn.addEventListener("click", () => {
      msg.style.display = "block";
      msg.innerHTML = "YAY!! 🎉💞 I owe you a date + a huge hug 🤍";
      confettiHearts();
    });

    function confettiHearts(){
      for(let i=0;i<28;i++){
        const s=document.createElement("div");
        s.textContent = Math.random()>.5 ? "💗" : "💖";
        s.style.position="fixed";
        s.style.left = (Math.random()*100)+"vw";
        s.style.top = "-10px";
        s.style.fontSize = (14+Math.random()*18)+"px";
        s.style.transition="transform 2.2s linear, opacity 2.2s linear";
        document.body.appendChild(s);
        requestAnimationFrame(()=>{
          s.style.transform = `translateY(${110+Math.random()*30}vh) rotate(${Math.random()*360}deg)`;
          s.style.opacity = "0";
        });
        setTimeout(()=>s.remove(), 2300);
      }
    }
  </script>
</body>
</html>
